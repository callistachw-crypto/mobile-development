<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>WuzzChat - Push Ready</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a3a5a">
    <link rel="icon" href="icons/logo 192x192.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a3a5a;
            --bg: #f9fafb;
            --text: #1f2937;
            --white: #ffffff;
            --gray-light: #e5e7eb;
            --wa-green: #25D366;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            background: var(--primary);
            color: var(--white);
            text-align: center;
            padding: 2.5rem 1rem;
            border-bottom-left-radius: 2rem;
            border-bottom-right-radius: 2rem;
        }

        .logo-img { width: 100px; height: auto; margin-bottom: 0.8rem; }
        .tagline { font-size: 0.85rem; opacity: 0.8; margin-top: 0.3rem; }

        .main {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 1.5rem;
        }

        .card {
            background: var(--white);
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            max-width: 420px;
            width: 100%;
            padding: 2rem;
        }

        .input-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--primary); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px; }

        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        select, input {
            width: 100%;
            padding: 0.9rem;
            background: #f3f4f6;
            border: 2px solid transparent;
            border-radius: 0.8rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary);
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--wa-green);
            background: white;
        }

        .num-container {
            position: relative;
            width: 100%;
        }

        .btn-paste {
            position: absolute;
            right: 0.6rem;
            top: 50%;
            transform: translateY(-50%);
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 0.8rem;
            border-radius: 0.6rem;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-img-wrapper {
            width: 75%; border: none; background: none;
            cursor: pointer; margin-top: 1rem;
            transition: transform 0.2s ease;
        }

        .btn-img-wrapper:hover { transform: scale(1.02); }
        .btn-img-wrapper img { width: 100%; height: auto; display: block; justify-content: center;}

        .history-section { margin-top: 2rem; width: 100%; max-width: 420px; text-align: center; }
        .history-title { font-size: 0.75rem; font-weight: 700; opacity: 0.4; margin-bottom: 1rem; text-transform: uppercase; }
        .history-list { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; }
        .history-item {
            padding: 0.5rem 1rem; background: white; border-radius: 2rem;
            font-size: 0.8rem; color: var(--primary); border: 1px solid var(--gray-light);
            cursor: pointer; font-weight: 600; transition: 0.2s;
        }
        .history-item:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .push-section { margin-top: 2rem; width: 100%; max-width: 420px; text-align: center; background: #f0f9ff; padding: 1.5rem; border-radius: 1.5rem; }
        .push-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 1rem; text-transform: uppercase; color: var(--primary); }
        #pushStatus { font-size: 0.8rem; margin-bottom: 0.8rem; padding: 0.6rem; border-radius: 1rem; font-weight: 600; }
        .push-enabled { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .push-disabled { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        #togglePush { 
            background: var(--primary); color: white; border: none; padding: 0.8rem 2rem; 
            border-radius: 2rem; font-size: 0.85rem; font-weight: 700; cursor: pointer; 
            transition: all 0.2s; margin: 0.5rem 0;
        }
        #togglePush:hover:not(:disabled) { background: #1e4a6b; transform: scale(1.02); }
        #togglePush:disabled { background: #9ca3af; cursor: not-allowed; }

        .test-push { background: var(--wa-green); margin-top: 1rem; }
        .footer { text-align: center; padding: 1.5rem; font-size: 0.75rem; background: var(--gray-light); color: #6b7280; }
    </style>
</head>
<body>

    <header class="header">
        <img src="icons/logo 192x192.png" alt="Logo" class="logo-img">
        <h1>WuzzChat</h1>
        <p class="tagline">Push Notifications Ready!</p>
    </header>

    <main class="main">
        <div class="card">
            <div class="input-group">
                <label>Country & Number</label>
                <div class="input-wrapper">
                    <select id="countrySelect"></select>
                    <div class="num-container">
                        <input type="tel" id="waNumber" placeholder="Phone number (e.g. 812345...)">
                        <button class="btn-paste" onclick="pasteNumber()">PASTE</button>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label>Message (Optional)</label>
                <input type="text" id="waMessage" placeholder="Hello, let's chat!">
            </div>

            <button class="btn-img-wrapper" onclick="launchWuzz()">
                <img src="icons/wa-button.png" alt="Chat on WhatsApp">
            </button>
        </div>

        <div class="history-section" id="historySection" style="display: none;">
            <p class="history-title">Recent Connections</p>
            <div class="history-list" id="historyList"></div>
        </div>

        <div class="push-section" id="pushSection">
            <p class="push-title">🔔 Push Notifications</p>
            <div id="pushStatus" class="push-disabled">Notifications off</div>
            <button id="togglePush">Enable Push</button>
            <small style="opacity: 0.7; font-size: 0.7rem; display: block; margin-top: 0.8rem;">
                Get notified even when app closed! Test with DevTools → Application → Push Messaging → Send Test Message
            </small>
            <button id="testPush" class="test-push" style="display:none;">Test Mock Push</button>
        </div>
    </main>

    <footer class="footer">
        WuzzChat • Push Ready • Reload SW to test
    </footer>

    <script>
        // COUNTRIES (shortened)
        const countries = [
            {n: "Indonesia", c: "62"}, {n: "United States", c: "1"}, {n: "Malaysia", c: "60"}
        ].sort((a, b) => a.n.localeCompare(b.n));

        const select = document.getElementById('countrySelect');
        countries.forEach(country => {
            const opt = document.createElement('option');
            opt.value = country.c;
            opt.textContent = `${country.n} (+${country.c})`;
            if (country.c === "62") opt.selected = true;
            select.appendChild(opt);
        });

        async function pasteNumber() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('waNumber').value = text.replace(/\D/g, '');
            } catch {}
        }

        function launchWuzz() {
            const code = select.value;
            let num = document.getElementById('waNumber').value.replace(/\D/g, '');
            let message = document.getElementById('waMessage').value;
            
            if (!num) return alert("Enter phone number");
            if (num.startsWith('0')) num = num.substring(1);
            
            const url = `https://wa.me/${code}${num}` + (message ? `?text=${encodeURIComponent(message)}` : '');
            window.open(url, '_blank');
        }

        // HISTORY (simplified)
        function saveHistory(fullNum) {
            let history = JSON.parse(localStorage.getItem('wuzz-history') || '[]');
            if (!history.includes(fullNum)) {
                history.unshift(fullNum);
                if (history.length > 5) history.pop();
                localStorage.setItem('wuzz-history', JSON.stringify(history));
            }
            renderHistory();
        }

        function renderHistory() {
            const history = JSON.parse(localStorage.getItem('wuzz-history') || '[]');
            const container = document.getElementById('historySection');
            const list = document.getElementById('historyList');
            if (history.length) {
                container.style.display = 'block';
                list.innerHTML = history.map(num => 
                    `<div class="history-item" onclick="launchWuzzFromHistory('${num}')">${num}</div>`
                ).join('');
            }
        }

        function launchWuzzFromHistory(num) {
            document.getElementById('waNumber').value = num.replace(/^\+62/, '');
            launchWuzz();
        }

        renderHistory();

        // === PUSH NOTIFICATIONS ===
        const VAPID_PUBLIC_KEY = 'BJoxf6_5Ez25UYaO2mEqXz3v-0Wi6RHtKYYRSC-Fh41R7yM6v4TTXvfldQ4z1UnmFRYAhcCVXzsYkLYK87J23w';

        async function b64ToUint8(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const rawData = window.atob(base64);
            return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
        }

        async function initPush() {
            if ('serviceWorker' in navigator && 'PushManager' in window) {
                const reg = await navigator.serviceWorker.register('./service-worker.js');
                const subscription = await reg.pushManager.getSubscription();
                if (subscription) {
                    document.getElementById('pushStatus').textContent = 'Push Enabled ✓';
                    document.getElementById('pushStatus').className = 'push-enabled';
                    document.getElementById('togglePush').textContent = 'Disable Push';
                }
            }
        }

        document.getElementById('togglePush').onclick = async () => {
            const btn = document.getElementById('togglePush');
            const status = document.getElementById('pushStatus');
            const testBtn = document.getElementById('testPush');
            
            if (btn.textContent.includes('Enable')) {
                if (Notification.permission !== 'granted') {
                    await Notification.requestPermission();
                }
                
                const reg = await navigator.serviceWorker.ready;
                const sub = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: await b64ToUint8(VAPID_PUBLIC_KEY)
                });
                status.textContent = 'Push Enabled ✓';
                status.className = 'push-enabled';
                btn.textContent = 'Disable Push';
                testBtn.style.display = 'block';
            } else {
                const reg = await navigator.serviceWorker.ready;
                const sub = await reg.pushManager.getSubscription();
                if (sub) await sub.unsubscribe();
                status.textContent = 'Push Disabled';
                status.className = 'push-disabled';
                btn.textContent = 'Enable Push';
                testBtn.style.display = 'none';
            }
        };

        document.getElementById('testPush').onclick = () => {
            navigator.serviceWorker.controller.postMessage({
                type: 'TEST_PUSH',
                title: 'Test Notification!',
                body: 'This is a test from WuzzChat!'
            });
        };

        // SW ready
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.ready.then(() => {
                initPush();
            });
        }

        // Test mock message handler
        navigator.serviceWorker.addEventListener('message', event => {
            if (event.data.type === 'TEST_PUSH') {
                new Notification(event.data.title, {
                    body: event.data.body,
                    icon: 'icons/logo 192x192.png'
                });
            }
        });
    </script>
</body>
</html>
