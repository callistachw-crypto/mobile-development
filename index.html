<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>WuzzChat</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a3a5a">
    <link rel="icon" href="icons/logo 192x192.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a3a5a;
            --bg: #f9fafb;
            --text: #1f2937;
            --white: #ffffff;
            --gray-light: #e5e7eb;
            --wa-green: #25D366;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Quicksand', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .header {
            background: var(--primary);
            color: var(--white);
            text-align: center;
            padding: 2.5rem 1rem;
            border-bottom-left-radius: 2rem;
            border-bottom-right-radius: 2rem;
        }

        .logo-img { width: 100px; height: auto; margin-bottom: 0.8rem; }
        .tagline { font-size: 0.85rem; opacity: 0.8; margin-top: 0.3rem; }

        .main {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 1.5rem;
        }

        .card {
            background: var(--white);
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            max-width: 420px;
            width: 100%;
            padding: 2rem;
        }

        .input-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--primary); margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px; }

        /* INTERNATIONAL SELECT STYLING */
        .input-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        select {
            width: 100%;
            padding: 0.9rem;
            background: #f3f4f6;
            border: 2px solid transparent;
            border-radius: 0.8rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--primary);
            cursor: pointer;
        }

        .num-container {
            position: relative;
            width: 100%;
        }

        input {
            width: 100%;
            padding: 0.9rem 1rem;
            background: #f3f4f6;
            border: 2px solid transparent;
            border-radius: 0.8rem;
            font-size: 1rem;
            font-weight: 600;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--wa-green);
            background: white;
        }

        .btn-paste {
            position: absolute;
            right: 0.6rem;
            top: 50%;
            transform: translateY(-50%);
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.5rem 0.8rem;
            border-radius: 0.6rem;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-img-wrapper {
            width: 75%; border: none; background: none;
            cursor: pointer; margin-top: 1rem;
            transition: transform 0.2s ease;
        }

        .btn-img-wrapper:hover { transform: scale(1.02); }
        .btn-img-wrapper img { width: 100%; height: auto; display: block; justify-content: center;}

        /* HISTORY AREA */
        .history-section { margin-top: 2rem; width: 100%; max-width: 420px; text-align: center; }
        .history-title { font-size: 0.75rem; font-weight: 700; opacity: 0.4; margin-bottom: 1rem; text-transform: uppercase; }
        .history-list { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; }
        .history-item {
            padding: 0.5rem 1rem; background: white; border-radius: 2rem;
            font-size: 0.8rem; color: var(--primary); border: 1px solid var(--gray-light);
            cursor: pointer; font-weight: 600; transition: 0.2s;
        }
        .history-item:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .footer { text-align: center; padding: 1.5rem; font-size: 0.75rem; background: var(--gray-light); color: #6b7280; }

        /* PUSH NOTIFICATION STYLES */
        .push-section { margin-top: 2rem; width: 100%; max-width: 420px; text-align: center; }
        .push-title { font-size: 0.75rem; font-weight: 700; opacity: 0.6; margin-bottom: 1rem; text-transform: uppercase; }
        #pushStatus { font-size: 0.8rem; margin-bottom: 0.8rem; padding: 0.6rem; border-radius: 1rem; font-weight: 600; }
        .push-enabled { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        .push-disabled { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        #togglePush { 
            background: var(--primary); color: white; border: none; padding: 0.8rem 2rem; 
            border-radius: 2rem; font-size: 0.85rem; font-weight: 700; cursor: pointer; 
            transition: all 0.2s;
        }
        #togglePush:hover:not(:disabled) { background: #1e4a6b; transform: scale(1.02); }
        #togglePush:disabled { background: #9ca3af; cursor: not-allowed; }
    </style>
</head>
<body>

    <header class="header">
        <img src="icons/logo 192x192.png" alt="Logo" class="logo-img">
        <h1>WuzzChat</h1>
        <p class="tagline">Don't save it, just Wuzz it!</p>
    </header>

    <main class="main">
        <div class="card">
            <div class="input-group">
                <label>Country & Number</label>
                <div class="input-wrapper">
                    <select id="countrySelect"></select>
                    
                    <div class="num-container">
                        <input type="tel" id="waNumber" placeholder="Phone number (e.g. 812345...)">
                        <button class="btn-paste" onclick="pasteNumber()">PASTE</button>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label>Message (Optional)</label>
                <input type="text" id="waMessage" placeholder="Hello, let's chat!">
            </div>

            <button class="btn-img-wrapper" onclick="launchWuzz()">
                <img src="icons/wa-button.png" alt="Chat on WhatsApp">
            </button>
        </div>

        <div class="history-section" id="historySection" style="display: none;">
            <p class="history-title">Recent Connections</p>
            <div class="history-list" id="historyList"></div>
        </div>

        <!-- PUSH NOTIFICATIONS SECTION -->
        <div class="push-section" id="pushSection">
            <p class="push-title">Stay Updated</p>
            <div id="pushStatus" class="push-disabled">Notifications disabled</div>
            <button id="togglePush">Enable Notifications</button>
            <small style="opacity: 0.6; font-size: 0.7rem; margin-top: 0.5rem; display: block;">
                Get timely reminders for new chats even when app is closed
            </small>
        </div>
    </main>

    <footer class="footer">
        Wuzz • Callista Christy • 2026
    </footer>

    <script>
        // 1. DATA NEGARA LENGKAP (Sorted A-Z)
        const countries = [
            {n: "Indonesia", c: "62"}, {n: "United States", c: "1"}, {n: "United Kingdom", c: "44"},
            {n: "Malaysia", c: "60"}, {n: "Singapore", c: "65"}, {n: "Australia", c: "61"},
            {n: "Japan", c: "81"}, {n: "South Korea", c: "82"}, {n: "India", c: "91"},
            {n: "Saudi Arabia", c: "966"}, {n: "United Arab Emirates", c: "971"},
            {n: "Afghanistan", c: "93"}, {n: "Albania", c: "355"}, {n: "Algeria", c: "213"},
            {n: "Argentina", c: "54"}, {n: "Austria", c: "43"}, {n: "Bangladesh", c: "880"},
            {n: "Belgium", c: "32"}, {n: "Brazil", c: "55"}, {n: "Canada", c: "1"},
            {n: "China", c: "86"}, {n: "Egypt", c: "20"}, {n: "France", c: "33"},
            {n: "Germany", c: "49"}, {n: "Hong Kong", c: "852"}, {n: "Italy", c: "39"},
            {n: "Netherlands", c: "31"}, {n: "New Zealand", c: "64"}, {n: "Philippines", c: "63"},
            {n: "Russia", c: "7"}, {n: "Spain", c: "34"}, {n: "Thailand", c: "66"},
            {n: "Turkey", c: "90"}, {n: "Vietnam", c: "84"}
            // Kamu bisa tambah lagi di sini, atau biarkan JS memuat daftar standar
        ].sort((a, b) => a.n.localeCompare(b.n));

        const select = document.getElementById('countrySelect');
        
        // Isi Dropdown
        countries.forEach(country => {
            const opt = document.createElement('option');
            opt.value = country.c;
            opt.textContent = `${country.n} (+${country.c})`;
            if(country.c === "62") opt.selected = true; // Default Indonesia
            select.appendChild(opt);
        });

        // 2. FITUR PASTE
        async function pasteNumber() {
            try {
                const text = await navigator.clipboard.readText();
                let cleaned = text.replace(/\D/g, '');
                const currentCode = select.value;
                
                if (cleaned.startsWith(currentCode)) cleaned = cleaned.substring(currentCode.length);
                else if (cleaned.startsWith('0')) cleaned = cleaned.substring(1);
                
                if (cleaned) document.getElementById('waNumber').value = cleaned;
            } catch (err) { console.warn("Clipboard error"); }
        }

        // 3. FITUR UTAMA
        async function launchWuzz() {
            const code = select.value;
            const input = document.getElementById('waNumber');
            const msgInput = document.getElementById('waMessage');
            
            let num = input.value.trim().replace(/\D/g, '');
            let message = encodeURIComponent(msgInput.value.trim());

            if (!num) return alert("Please enter a phone number!");
            if (num.startsWith('0')) num = num.substring(1);

            const finalNum = code + num;
            saveHistory(`+${code}${num}`);

            let url = `https://wa.me/${finalNum}`;
            if (message) url += `?text=${message}`;

            // Try direct open
            try {
                const controller = await navigator.serviceWorker.ready;
                await fetch(url, {mode: 'no-cors'});
                window.open(url, '_blank');
            } catch {
                // Queue for background sync
                controller.postMessage({
                    type: 'QUEUE_WHATSAPP',
                    url: url
                }, [controller.postMessage.bind(controller)]).then(() => {
                    alert('Queued! Will open WhatsApp when online.');
                });
            }
        }

        // 4. SISTEM HISTORY
        function saveHistory(fullNum) {
            let history = JSON.parse(localStorage.getItem('wuzz_intl_v2') || '[]');
            if (!history.includes(fullNum)) {
                history.unshift(fullNum);
                if (history.length > 5) history.pop();
                localStorage.setItem('wuzz_intl_v2', JSON.stringify(history));
                renderHistory();
            }
        }

        function renderHistory() {
// ======================
// NOTE TAKING MODE
// ======================
const params = new URLSearchParams(window.location.search);
const mode = params.get("mode");

if (mode === "note") {
    document.body.classList.add("note-mode");

    const messageInput = document.getElementById("waMessage");
    const sendBtn = document.querySelector(".btn-img-wrapper");

    if (messageInput) {
        messageInput.focus();
        messageInput.placeholder = "Tulis pesan cepat ke WhatsApp...";
    }

    if (sendBtn) {
        sendBtn.title = "Lanjut ke WhatsApp";
    }
}
            const history = JSON.parse(localStorage.getItem('wuzz_intl_v2') || '[]');
            const container = document.getElementById('historySection');
            const list = document.getElementById('historyList');

            if (history.length > 0) {
                container.style.display = 'block';
                list.innerHTML = history.map(num => `<div class="history-item" onclick="useHistory('${num}')">${num}</div>`).join('');
            }
        }
        function useHistory(fullNum) {
            const cleaned = fullNum.replace('+', '');
            // Deteksi kode negara dari riwayat
            for (let option of select.options) {
                if (cleaned.startsWith(option.value)) {
                    select.value = option.value;
                    document.getElementById('waNumber').value = cleaned.substring(option.value.length);
                    break;
                }
            }
        }

        // Handle PWA shortcuts\n        const urlParams = new URLSearchParams(window.location.search);\n        const hash = window.location.hash;\n        if (urlParams.has('country')) {\n            const countryCode = urlParams.get('country');\n            Array.from(select.options).forEach(opt => {\n                if (opt.value === countryCode) opt.selected = true;\n            });\n        }\n        if (hash === '#history') {\n            document.getElementById('historySection').style.display = 'block';\n        }\n        renderHistory();\n    </script>\n
    <script>
      if ('serviceWorker' in navigator) {
navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('SW OK:', reg.scope))
          .catch(err => console.log('SW ERROR:', err));
      }
      </script>
</body>
</html>
